name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint, typecheck and tests already ran in CI for this commit (main only takes green PRs).
      - name: Export web build
        run: npx expo export -p web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: SPA fallback for deep links + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      # Pages must be enabled once by the repo owner (Settings → Pages → Source: GitHub Actions;
      # private repos need a paid plan). Until then, skip the upload/deploy instead of failing.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository - skipping deploy. Enable it in Settings > Pages > Source = GitHub Actions."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
