name: Android APK

# Builds an installable Android APK.
# - Push a tag like v1.2.3 → release "v1.2.3" with asset volley-lineup-1.2.3.apk.
#   The tag must match "version" in app.json and package.json.
# - Manual run (Actions → Android APK → Run workflow) → build only (workflow artifact), no release.
# The APK is signed with the Expo template's fixed debug key: fine for sideloading and for
# updating over earlier versions, not for the Play Store.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Removes the old rolling "android-latest" release (replaced by versioned releases).
  remove-android-latest:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete android-latest --cleanup-tag --yes || echo "android-latest already gone"

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::app.json version ($APP_VERSION) != package.json version ($PKG_VERSION)"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$APP_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v$APP_VERSION"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install
        env:
          CI: 1
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the APK
        id: apk
        run: |
          FILE="volley-lineup-${{ steps.version.outputs.version }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: volley-lineup-apk
          path: ${{ steps.apk.outputs.file }}
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "Volley Lineup $GITHUB_REF_NAME" \
            --notes "Android APK for Volley Lineup $GITHUB_REF_NAME. Download **${{ steps.apk.outputs.file }}** under Assets and open it on your Android phone. See the README section \"Install on Android (APK)\"." \
            --latest
