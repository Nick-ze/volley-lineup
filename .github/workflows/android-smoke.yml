name: Android smoke test (emulator)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-smoke.yml
      - scripts/android-smoke.sh
      - app/**
      - src/**

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check (no app build): can an emulator boot on this runner at all?
  emulator-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: KVM and CPU info
        run: |
          ls -l /dev/kvm || echo "NO /dev/kvm"
          grep -cE 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm flags"
          nproc; free -m
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Try to start an emulator directly and show its output
        run: |
          SDK=$ANDROID_HOME
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-30;default;x86_64" "emulator" > /dev/null
          echo no | $SDK/cmdline-tools/latest/bin/avdmanager create avd -n t -k "system-images;android-30;default;x86_64" --force
          $SDK/emulator/emulator -accel-check || true
          ($SDK/emulator/emulator -avd t -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > emu.log 2>&1 &)
          for i in $(seq 1 90); do
            if [ "$($SDK/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then echo "BOOTED after $((i*5))s"; break; fi
            sleep 5
          done
          echo "--- emulator log (tail) ---"; tail -40 emu.log

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
        env:
          CI: 1
      - name: Build release APK for the emulator (x86_64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "NO KVM"
          nproc; free -m
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: OUT=e2e-out ./scripts/android-smoke.sh android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: e2e-out
